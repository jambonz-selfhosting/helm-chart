global:
  # if defined, create and/or reference db and monitoring services in the specified namespace;
  # otherwise they create and/or referenced them in whatever the .Release namespace is
  db:
  traefik:
    tls:
      enabled: false
      clusterIssuer: letsencrypt-prod
      email: daveh@drachtio.org
  cassandra:
    enabled: false
  monitoring:
    nodeMetrics:
      enabled: true
  logging:
    enabled: true
  track:
    serviceProviderCalls: "0"
    accountCalls: "0"
    appCalls: "0"
  affinity:
  podAnnotations:

db: 
  mysql: 
    secret: amFtYm9uZXM=
monitoring: 
  postgres: 
    secret: amFtYm9uZXM=

# (required) name of cloud provider: azure, aws, gcp, exoscale, or none
cloud:

# (required) base domain for all portals (e.g. jambonz.example.com)
# Hostnames are derived automatically:
#   webapp  -> jambonz.example.com
#   api     -> api.jambonz.example.com
#   grafana -> grafana.jambonz.example.com
# Individual hostnames below can still override if needed.
baseUrl:

# set this to "1" if you are deploying on AWS and you are using IMDSv2
awsUseIMDSv2: "1"

# set this to true if you are deploying on Azure AKS and you are using IMDSv2
aksUseIMDSv2: true

jwt:
  secret: Rz11JS05NyNUZmZZZg==

# basic information that applies to all jambonz Node.js app
jambonz: 
  # a short identifier for the cluster, needed if multiple jambonz clusters will share the same redis
  clusterId: 

# these values direct which nodepool the SBC sip and rtp pods will be placed in.
# these pods have to be in special nodepools that use host network binding due to the nature
# of sip signaling and the current lack of support for sip in ingress controllers.
#
#   Note: if you want to put sip and rtp into a single nodepool (e.g. to save cost on a smaller deployment)
#   then set both labels below to the same value and both tolerations below to the same value  
#   and use those values when creating your single edge-facing nodepool when you spin up the cluster.
#   (But, for production deployments, separate nodepools are recommended for sip and rtp, and this is the default setup below).
sbc: 
  # EIP/static IP allocator for SBC nodes (supports aws, exoscale, gcp)
  # Runs as an initContainer to assign a static IP before the SBC starts.
  # Disabled by default: the allocator fails hard (by design) when no matching
  # EIPs exist, so enable it only after creating the tagged/labeled IPs
  # (the jambonz-selfhosting terraform scripts do this for you).
  # For AWS: tag your EIPs with the role key/value below.
  # For Exoscale: label your Elastic IPs and provide API credentials via a K8s secret.
  # For GCP: label your static addresses and ensure nodes have compute-rw scope.
  eipAllocator:
    enabled: false
    # Per-pool switches, both default true, and only consulted when enabled is
    # true. Set one to false where that pool should keep the node's own public
    # address instead of claiming an EIP. Exoscale needs this: a managed Elastic
    # IP requires a TCP healthcheck target and an RTP node has none that is safe
    # to expose (rtpengine's ng port is UDP), so SKS runs the allocator for SIP
    # only -- see the RTP note in terraform exoscale/provision-sks-cluster.
    sipEnabled: true
    rtpEnabled: true
    image: jambonz/eip-allocator:1.0.1
    rtpEipGroupRoleKey: role
    rtpEipGroupRole: rtp-node
    sipEipGroupRoleKey: role
    sipEipGroupRole: sip-node
    # exoscale only: name of a K8s secret containing keys "api-key" and "api-secret"
    exoscaleApiKeySecret: ""
    # exoscale only: zone where EIPs are allocated (e.g. ch-gva-2)
    exoscaleZone: ""
  sip: 
    nodeSelector: 
      label: voip-environment 
      value: sip
    toleration: sip
    podAnnotations:
    ssl:
      # this is for sip over tls only, not for https to to web portals - for that, look at global.traefik.tls.enabled above
      enabled: false
      hostname:
      ## Add Custom CA certificate. A tls type secret named "drachtio-secret" will be created based on the values of tls.crt and tls.key
      ## Careful with the indentation
      ## For more information, see https://helm.sh/docs/chart_template_guide/yaml_techniques/#strings-in-yaml
      ##
      ## Custom CA certificate in plaintext, not base64 encoded.
      ## Example:
      ##   crt: |
      ##     -----BEGIN CERTIFICATE-----
      ##     -----END CERTIFICATE-----
      crt: ""
      ## CA certificate private key in plaintext, not base64 encoded.
      ## Example:
      ## key: |
      ##   -----BEGIN PRIVATE KEY-----
      ##   -----END PRIVATE KEY-----
      key: ""
  rtp: 
    nodeSelector: 
      label: voip-environment 
      value: rtp
    toleration: rtp
    podAnnotations:
    storageClassName:
    # list of extra initContainers
    extraInitContainers:
    # list of extra containers/sidecars
    extraContainers:
    # list of extra volumes
    extraVolumes:
    statefulset:
      enabled: false
      # match this value with the number of jambonz-rtp nodes
      replicas: 1

# information used by the Node.js apps to write statsd to a telegraf listening instance
stats: 
  enabled: "1"
  host: telegraf
  port: "8125"
  protocol: tcp 
  telegraf: "1"
  sampleRate: "1"

# configuration information for rtpengine
rtpengine:
  image: jambonz/rtpengine:14.1.1.8-jambonz13
  imagePullPolicy: IfNotPresent
  sidecarImage: jambonz/rtpengine-sidecar:0.9.9
  sidecarImagePullPolicy: IfNotPresent
  wsUrl: "ws://127.0.0.1:8081"
  dtmfLogPort:  "22223"
  loglevel: "9"
  homerId: "11"
  recordings:
    enabled: false
    pvc: recordings-shared-volume
    dir: /recordings
    method: pcap
    storage: 10Gi

# used by sidecar apps in sbc-sip and feature-server to connect locally to drachtio server
drachtio:
  image: jambonz/drachtio-server:10.1.4
  imagePullPolicy: IfNotPresent
  host: "127.0.0.1"
  port: "9022"
  homerId: "10"
  secret: Y3ltcnU=

# mediajam media server configuration
mediajam:
  image: jambonz/mediajam:0.5.4
  imagePullPolicy: IfNotPresent
  args:
    - "-addr"
    - ":8021"
    - "-log-file"
    - "-"
  # optional Krisp noise-cancellation API key (obtain separately from Krisp);
  # leave empty to run without Krisp. Can be added later via a values override.
  krispApiKey: ""

# configuration for jambonz-api-server
api:
  image: jambonz/api-server:11.1.4
  imagePullPolicy: IfNotPresent
  httpPort: "3000"
  replicas: 1
  podAnnotations:

dbUpgrade:
  image: jambonz/db-create:11.1.4
  imagePullPolicy: IfNotPresent

# jambonz-webapp configuration
webapp:
  image: jambonz/webapp:11.1.4
  imagePullPolicy: IfNotPresent
  replicas: 1
  podAnnotations:

# standalone recording upload service for high-volume deployments;
# when disabled, the feature server uploads recordings to the API server
uploadRecordings:
  enabled: true
  image: jambonz/upload-recordings:1.9.0
  imagePullPolicy: IfNotPresent
  replicas: 1
  httpPort: "3000"
  args:
    - "--port"
    - "3000"
    - "--threads"
    - "16"
    - "--aws-max-connections"
    - "150"
    - "--buffer-process-size"
    - "128"
    - "--max-buffer-size"
    - "8"
  podAnnotations:

# sbc-inbound configuration
sbcInbound:
  image: jambonz/inbound:11.1.4
  imagePullPolicy: IfNotPresent
  drachtioPort: "4000"
  replicas: 1
  podAnnotations:

# sbc-outbound configuration
sbcOutbound:
  image: jambonz/outbound:11.1.4
  imagePullPolicy: IfNotPresent
  drachtioPort: "4000"
  replicas: 1
  podAnnotations:

# sbc-sip-sidecar configuration
sbcSipSidecar:
  image: jambonz/sbc-sip-sidecar:0.9.9
  imagePullPolicy: IfNotPresent

# sbc-call-router configuration
sbcCallRouter:
  image: jambonz/sbc-call-router:0.9.9
  imagePullPolicy: IfNotPresent
  httpPort: "3000"
  replicas: 1

# feature-server configuration
featureServer:
  image: jambonz/feature-server:11.1.4
  imagePullPolicy: IfNotPresent
  httpPort: "3000"
  drachtioConnection: "127.0.0.1:9022:cymru"
  # mediajam control connection (no password required)
  mediajamConnection: "127.0.0.1:8021"
  replicas: 2
  otelSampleRate: 1.0
  podAnnotations:
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# sbc-sip configuration
sbcSip: 
  loglevel: info 
  sofiaLoglevel: "3"

# if you want to block bad sip actors, get an api key from apiban.org and put it below
apiban: 
  apiKey: 
  redisKey: "apiban:ips"
  refreshInterval: "3600"
  foreverBlockRanges: "128.90.0.0/16,162.142.125.0/24,198.235.24.0/24,205.210.31.0/24"
  podAnnotations:

loki:
  image: grafana/loki:2.9.6
  storage: 50Gi
  retentionPeriod: 36h
  podAnnotations:

promtail:
  image: grafana/promtail:2.9.6
  podAnnotations:

grafana:
  image: grafana/grafana-oss:10.3.3
  storage: 10Gi
  podAnnotations:
            
heplifyServer:
  image: jambonz/heplify-server:1.0.4
  podAnnotations:
influxdb: 
  image: influxdb:1.8
  loglevel: info
  storage: 30Gi
  podAnnotations:
cassandra:
  image: cassandra:3.11
  keyspace: jaeger_v1_dc1
  storage: 30Gi
  podAnnotations:
# pcap-server serves SIP pcap export (replaces the homer web-app in v11).
# Reads captured messages from the same postgres (homer_data db) that
# heplify-server writes to; api-server reaches it via the homer-webapp service.
pcapServer:
  image: jambonz/pcap-server:1.0.4
  imagePullPolicy: IfNotPresent
  # basic-auth credential for the pcap-export endpoint. api-server is the only
  # client (HOMER_USERNAME / HOMER_PASSWORD); both sides read these, so change
  # them together. authSecret is base64, like the other secrets in this chart.
  authUsername: admin
  authSecret: c2lwY2FwdHVyZQ==
  podAnnotations:
postgres:
  # Holds the homer_data SIP capture DB (written by heplify-server, read by
  # pcap-server). postgres 11 went EOL in Nov 2023, but a major-version bump is
  # not a tag change: the data directory is version-specific, so a newer image
  # refuses to start on an existing PVC and needs pg_upgrade or dump/restore.
  image: postgres:11-alpine
  user: cm9vdA==
  secret: aG9tZXJTZXZlbg==
  storage: 30Gi 
  podAnnotations:
telegraf: 
  image: telegraf:1.19
  podAnnotations:
jaegerCollector:
  image: jaegertracing/jaeger-collector:1.46
  podAnnotations:
jaegerQuery:
  image: jaegertracing/jaeger-query:1.46
  podAnnotations:

# Storage Class definition for the Stateful Sets
storageClassName:

# Affinity
affinity:

mysql:
  # Keep on the 8.0 series: mysql-statefulset.yaml passes
  # --default-authentication-plugin, which was removed in MySQL 8.4. See the
  # comment there before bumping this. 8.0 is itself past EOL (Apr 2026).
  image: mysql:8.0
  host: mysql 
  database: jambones
  user: jambones 
  storage: 10Gi
  # if empty, an empty password is used for the root user using MYSQL_ALLOW_EMPTY_PASSWORD
  rootSecret:
  secret: amFtYm9uZXM=
  podAnnotations:

# redis configuration used by Node.js app that need to connect
redis: 
  image: redis:alpine
  host: redis 
  port: "6379"
  podAnnotations:
