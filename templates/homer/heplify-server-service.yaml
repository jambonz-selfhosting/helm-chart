apiVersion: v1
kind: Service
metadata:
  labels:
    app: heplify-server
{{ include "common.labels" . | indent 4 }}
  name: heplify-server
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
    - name: "heplify-server"
      port: 9060
      targetPort: 9060
      protocol: UDP
    - name: "stats-scraper"
      port: 9096
      targetPort: 9096
      protocol: TCP
  # Deliberately NOT headless: drachtio (sbc-sip) and rtpengine (sbc-rtp)
  # resolve this name once at startup and cache it for their HEP stream, so it
  # must be a stable ClusterIP that survives heplify-server pod restarts.
  selector:
    app: heplify-server
