apiVersion: v1
kind: Service
metadata:
  labels:
    app: heplify-server
{{ include "common.labels" . | indent 4 }}
  name: heplify-server
  namespace: {{ .Release.Namespace | quote }}
spec:
  # NOTE: intentionally a normal ClusterIP service, NOT headless.
  # drachtio resolves this name once at startup and caches the IP for its HEP
  # (UDP 9060) stream. A headless service (clusterIP: None) returns the pod IP,
  # so every heplify-server pod restart changed that IP and silently blackholed
  # HEP capture (Homer showed nothing). A stable ClusterIP survives pod
  # restarts because kube-proxy tracks the endpoint.
  ports:
    - name: "heplify-server"
      port: 9060
      targetPort: 9060
      protocol: UDP
    - name: "stats-scraper"
      port: 9096
      targetPort: 9096
      protocol: TCP
  selector:
    app: heplify-server
