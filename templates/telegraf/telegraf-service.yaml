apiVersion: v1
kind: Service
metadata:
  labels:
    app: telegraf
{{ include "common.labels" . | indent 4 }}
  name: telegraf
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
    - name: statsd-tcp
      port: 8125
      targetPort: 8125
      protocol: TCP
    - name: statsd-udp
      port: 8125
      targetPort: 8125
      protocol: UDP
  selector:
    app: telegraf
  clusterIP: None
